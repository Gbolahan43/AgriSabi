name: AgriSabi CI — Backend Tests

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          # Minimal env to allow app import and config validation
          AWS_REGION: us-west-2
          BEDROCK_KB_ID: test_kb_id
          PRIMARY_MODEL_ID: anthropic.claude-3-5-sonnet-20240620-v1:0
          FALLBACK_MODEL_ID: anthropic.claude-3-5-sonnet-20240620-v1:0
          OPENWEATHERMAP_API_KEY: test_key
          ISDASOIL_USERNAME: test@example.com
          ISDASOIL_PASSWORD: test_password
          AWS_TABLE_PREFIX: prod_
          CORS_ALLOWED_ORIGINS: "http://localhost:3000"
          # Dummy AWS creds so boto3 doesn't error on client creation
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
        run: python -m pytest tests/ -v --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: backend/.pytest_cache/
