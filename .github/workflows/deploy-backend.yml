name: AgriSabi CD — Deploy to App Runner

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
  workflow_run:
    workflows: ["AgriSabi CI — Backend Tests"]
    types:
      - completed
    branches: [main]

jobs:
  deploy:
    name: Trigger App Runner Deployment
    runs-on: ubuntu-latest
    # Only run if CI tests passed (or on direct main push after tests pass)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Trigger App Runner deployment
        env:
          SERVICE_ARN: ${{ secrets.APP_RUNNER_SERVICE_ARN }}
        run: |
          aws apprunner start-deployment --service-arn $SERVICE_ARN
          echo "✅ App Runner deployment triggered successfully"

      - name: Wait for deployment to complete
        env:
          SERVICE_ARN: ${{ secrets.APP_RUNNER_SERVICE_ARN }}
        run: |
          echo "Polling App Runner until service is RUNNING..."
          for i in $(seq 1 30); do
            STATUS=$(aws apprunner describe-service --service-arn $SERVICE_ARN --query 'Service.Status' --output text)
            echo "Status: $STATUS (attempt $i/30)"
            if [ "$STATUS" = "RUNNING" ]; then
              echo "✅ Deployment complete — service is RUNNING"
              exit 0
            fi
            sleep 20
          done
          echo "❌ Deployment timed out after 10 minutes"
          exit 1
